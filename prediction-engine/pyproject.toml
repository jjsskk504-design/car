[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-prediction-engine"
version = "0.1.0"
description = "Deterministic trajectory prediction baselines for PRISM VehicleFrame v1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - competition project" }
authors = [{ name = "PRISM Part 01 team" }]
dependencies = [
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[project.scripts]
prism-predict = "prism_predict.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism_predict = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

